<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="mX0Knj2KaZBOFZZVqyVL-4lVLQ27l4CRtPeqz-NDzmI" />
    
    <!-- Primary Meta Tags -->
    <title>YKS Net Takip Paneli & Branş Analiz Aracı</title>
    <meta name="title" content="YKS Net Takip Paneli & Branş Analiz Aracı">
    <meta name="description" content="TYT ve AYT deneme netlerinizi branş branş tarih tarih kaydedin, gelişiminizi takip edin!">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yks-net-hesaplayici.vercel.app/">
    <meta property="og:title" content="YKS Net Takip Paneli & Branş Analizi">
    <meta property="og:description" content="Türkçe, Sosyal, Matematik ve Fen netlerinizi kaydedin, gelişiminizi izleyin.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=80">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-6 px-4 font-sans antialiased flex flex-col justify-between">

    <div class="max-w-6xl mx-auto w-full space-y-6">
        
        <!-- Header & Top Navigation Bar -->
        <header class="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
            <div class="text-center md:text-left space-y-1">
                <h1 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                    YKS Net Takip Paneli
                </h1>
                <p class="text-slate-400 text-xs max-w-md">
                    Deneme netlerinizi ders ders kaydedin, gelişiminizi kontrol altında tutun!
                </p>
            </div>

            <!-- Top Right Cross Links -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <a href="https://yks-tercih-robotu.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-400 transition flex items-center gap-1.5 shadow-sm">
                    🎓 Tercih Robotu
                </a>
                <a href="https://qr-kod-olusturucu.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-emerald-400 transition flex items-center gap-1.5 shadow-sm">
                    ⚡ QR Kod Oluşturucu
                </a>
            </div>
        </header>

        <!-- Main Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Yeni Deneme Kaydı Ekle</h2>
            
            <form id="net-form" onsubmit="denemeEkle(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Deneme Adı / Yayın</label>
                        <input type="text" id="deneme-adi" placeholder="Örn: 3D TYT 1. Deneme" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Sınav Türü</label>
                        <select id="deneme-turu" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="TYT">TYT</option>
                            <option value="AYT Sayısal">AYT Sayısal</option>
                            <option value="AYT EA">AYT Eşit Ağırlık</option>
                            <option value="AYT Sözel">AYT Sözel</option>
                        </select>
                    </div>
                </div>

                <!-- Branş Netleri Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2 border-t border-slate-800/80">
                    <div>
                        <label class="block text-[11px] font-semibold text-indigo-300 mb-1">Türkçe Neti</label>
                        <input type="number" step="0.25" id="net-turkce" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-purple-300 mb-1">Sosyal Neti</label>
                        <input type="number" step="0.25" id="net-sosyal" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-pink-300 mb-1">Matematik Neti</label>
                        <input type="number" step="0.25" id="net-matematik" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-cyan-300 mb-1">Fen Neti</label>
                        <input type="number" step="0.25" id="net-fen" placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-6 rounded-xl text-xs shadow-md transition">
                        + Denemeyi Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Kayıtlı Denemeler Tablosu Card -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Kaydedilen Denemeler (<span id="count-display" class="text-indigo-400">0</span>)
                </h2>
                <button onclick="tumunuTemizle()" class="text-[10px] text-rose-400 hover:underline">Tümünü Sil</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="text-[10px] text-slate-500 bg-slate-950 uppercase tracking-wider">
                        <tr>
                            <th class="px-3 py-2.5 rounded-l-lg">Deneme Adı</th>
                            <th class="px-3 py-2.5 text-center">Tür</th>
                            <th class="px-3 py-2.5 text-center">Türkçe</th>
                            <th class="px-3 py-2.5 text-center">Sosyal</th>
                            <th class="px-3 py-2.5 text-center">Matematik</th>
                            <th class="px-3 py-2.5 text-center">Fen</th>
                            <th class="px-3 py-2.5 text-center">Toplam Net</th>
                            <th class="px-3 py-2.5 text-right rounded-r-lg">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="deneme-listesi" class="divide-y divide-slate-800/50">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- Simple Footer -->
    <footer class="mt-12 pt-4 text-center border-t border-slate-800/60">
        <p class="text-[10px] text-slate-600">© 2026 Akıllı Web Araçları. Tüm hakları saklıdır.</p>
    </footer>

    <!-- JavaScript Engine -->
    <script>
        let denemeler = JSON.parse(localStorage.getItem('yks_net_v2_kayitlar')) || [];

        function kaydetVeGoster() {
            localStorage.setItem('yks_net_v2_kayitlar', JSON.stringify(denemeler));
            listeyiGoster();
        }

        function denemeEkle(e) {
            e.preventDefault();
            const adi = document.getElementById('deneme-adi').value;
            const turu = document.getElementById('deneme-turu').value;
            const turkce = parseFloat(document.getElementById('net-turkce').value) || 0;
            const sosyal = parseFloat(document.getElementById('net-sosyal').value) || 0;
            const matematik = parseFloat(document.getElementById('net-matematik').value) || 0;
            const fen = parseFloat(document.getElementById('net-fen').value) || 0;

            const toplamNet = turkce + sosyal + matematik + fen;

            if (adi) {
                denemeler.push({
                    id: Date.now(),
                    adi: adi,
                    turu: turu,
                    turkce: turkce,
                    sosyal: sosyal,
                    matematik: matematik,
                    fen: fen,
                    toplam: toplamNet
                });
                document.getElementById('net-form').reset();
                kaydetVeGoster();
            }
        }

        function denemeSil(id) {
            denemeler = denemeler.filter(d => d.id !== id);
            kaydetVeGoster();
        }

        function tumunuTemizle() {
            if (confirm("Tüm deneme kayıtlarınız silinsin mi?")) {
                denemeler = [];
                kaydetVeGoster();
            }
        }

        function listeyiGoster() {
            const tbody = document.getElementById('deneme-listesi');
            const countDisplay = document.getElementById('count-display');
            
            if (!tbody) return;

            countDisplay.innerText = denemeler.length;

            if (denemeler.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-500 italic">Henüz kaydedilmiş deneme yok. Yukarıdaki formdan ekleyebilirsiniz.</td></tr>`;
                return;
            }

            tbody.innerHTML = denemeler.map(item => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="px-3 py-2.5 font-bold text-slate-200">${item.adi}</td>
                    <td class="px-3 py-2.5 text-center text-indigo-400 font-mono">${item.turu}</td>
                    <td class="px-3 py-2.5 text-center">${item.turkce.toFixed(2)}</td>
                    <td class="px-3 py-2.5 text-center">${item.sosyal.toFixed(2)}</td>
                    <td class="px-3 py-2.5 text-center">${item.matematik.toFixed(2)}</td>
                    <td class="px-3 py-2.5 text-center">${item.fen.toFixed(2)}</td>
                    <td class="px-3 py-2.5 text-center font-bold text-emerald-400">${item.toplam.toFixed(2)} Net</td>
                    <td class="px-3 py-2.5 text-right">
                        <button onclick="denemeSil(${item.id})" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1 text-xs">Sil</button>
                    </td>
                </tr>
            `).join('');
        }

        window.onload = function() {
            listeyiGoster();
        };
    </script>
</body>
</html>
