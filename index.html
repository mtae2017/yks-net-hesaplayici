<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="mX0Knj2KaZBOFZZVqyVL-4lVLQ27l4CRtPeqz-NDzmI" />
    
    <!-- Primary Meta Tags -->
    <title>YKS Net Takip Paneli & Deneme Analiz Aracı</title>
    <meta name="title" content="YKS Net Takip Paneli & Deneme Analiz Aracı">
    <meta name="description" content="TYT ve AYT deneme netlerinizi tarih tarih kaydedin, grafiklerle gelişiminizi takip edin ve hedeflerinize ulaşın. Ücretsiz ve reklamsız!">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yks-net-hesaplayici.vercel.app/">
    <meta property="og:title" content="YKS Net Takip Paneli & Deneme Analizi">
    <meta property="og:description" content="Deneme netlerinizi kaydedin, gelişim grafiğinizi izleyin ve hedeflerinize bir adım daha yaklaşın.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=80">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yks-net-hesaplayici.vercel.app/">
    <meta property="twitter:title" content="YKS Net Takip Paneli & Deneme Analizi">
    <meta property="twitter:description" content="Deneme netlerinizi kaydedin, gelişim grafiğinizi izleyin.">
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1200&q=80">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-6 px-4 font-sans antialiased flex flex-col justify-between">

    <div class="max-w-4xl mx-auto w-full space-y-6">
        
        <!-- Header & Top Navigation Bar -->
        <header class="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
            <div class="text-center md:text-left space-y-1">
                <div class="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-0.5 rounded-full text-indigo-400 text-[11px] font-semibold">
                    📈 Gelişim Takip Sistemi
                </div>
                <h1 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                    YKS Net Takip Paneli
                </h1>
            </div>

            <!-- Top Right Cross Links -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <a href="https://yks-tercih-robotu.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-400 transition flex items-center gap-1.5 shadow-sm">
                    🎓 Tercih Robotu
                </a>
                <a href="https://qr-kod-olusturucu.vercel.app" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-emerald-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-emerald-400 transition flex items-center gap-1.5 shadow-sm">
                    ⚡ QR Kod Oluşturucu
                </a>
            </div>
        </header>

        <!-- Deneme Ekleme Kartı -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Yeni Deneme Sonucu Ekle</h2>
            
            <form id="net-form" onsubmit="denemeEkle(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Deneme Adı / Tarih</label>
                    <input type="text" id="deneme-adi" placeholder="Örn: Özdebir TYT 1" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Sınav Türü</label>
                    <select id="deneme-turu" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="TYT">TYT</option>
                        <option value="AYT Sayısal">AYT Sayısal</option>
                        <option value="AYT Eşit Ağırlık">AYT Eşit Ağırlık</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Toplam Net</label>
                    <input type="number" step="0.25" id="deneme-net" placeholder="Örn: 85.50" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="sm:col-span-3 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-6 rounded-xl text-xs shadow-md transition">
                        + Denemeyi Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Kayıtlı Denemeler Listesi -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Geçmiş Denemelerim</h2>
                <button onclick="tumunuTemizle()" class="text-[10px] text-rose-400 hover:underline">Tümünü Sil</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="text-[10px] text-slate-500 bg-slate-950 uppercase tracking-wider">
                        <tr>
                            <th class="px-3 py-2.5 rounded-l-lg">Deneme Adı</th>
                            <th class="px-3 py-2.5 text-center">Tür</th>
                            <th class="px-3 py-2.5 text-center">Net</th>
                            <th class="px-3 py-2.5 text-right rounded-r-lg">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="deneme-listesi" class="divide-y divide-slate-800/50">
                        <!-- Dynamic items -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Simple Footer -->
    <footer class="mt-12 pt-4 text-center border-t border-slate-800/60">
        <p class="text-[10px] text-slate-600">© 2026 Akıllı Web Araçları. Tüm hakları saklıdır.</p>
    </footer>

    <!-- JavaScript Engine -->
    <script>
        let denemeler = JSON.parse(localStorage.getItem('yks_denemelerim')) || [];

        function kaydetVeGoster() {
            localStorage.setItem('yks_denemelerim', JSON.stringify(denemeler));
            listeyiGoster();
        }

        function denemeEkle(e) {
            e.preventDefault();
            const adi = document.getElementById('deneme-adi').value;
            const turu = document.getElementById('deneme-turu').value;
            const net = parseFloat(document.getElementById('deneme-net').value);

            if (adi && !isNaN(net)) {
                denemeler.push({
                    id: Date.now(),
                    adi: adi,
                    turu: turu,
                    net: net
                });
                document.getElementById('net-form').reset();
                kaydetVeGoster();
            }
        }

        function denemeSil(id) {
            denemeler = denemeler.filter(d => d.id !== id);
            kaydetVeGoster();
        }

        function tumunuTemizle() {
            if (confirm("Tüm deneme kayıtlarınız silinsin mi?")) {
                denemeler = [];
                kaydetVeGoster();
            }
        }

        function listeyiGoster() {
            const tbody = document.getElementById('deneme-listesi');

            if (denemeler.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500 italic">Henüz kaydedilmiş deneme yok.</td></tr>`;
                return;
            }

            tbody.innerHTML = denemeler.map(item => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="px-3 py-2.5 font-bold text-slate-200">${item.adi}</td>
                    <td class="px-3 py-2.5 text-center text-indigo-400 font-mono">${item.turu}</td>
                    <td class="px-3 py-2.5 text-center font-bold text-emerald-400">${item.net} Net</td>
                    <td class="px-3 py-2.5 text-right">
                        <button onclick="denemeSil(${item.id})" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1 text-xs">Sil</button>
                    </td>
                </tr>
            `).join('');
        }

        window.onload = function() {
            listeyiGoster();
        };
    </script>
</body>
</html>
